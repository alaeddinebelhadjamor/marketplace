# Cible Prometheus de la marketplace v2.
# À AJOUTER dans la section scrape_configs du fichier prometheus.yml existant
# (Téléchargements\prometheus_extracted\prometheus-2.55.1.windows-amd64\prometheus.yml),
# à côté de la cible de la v1 (localhost:3000), puis redémarrer Prometheus.

  - job_name: marketplace-v2
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8010']
        labels:
          app: marketplace-v2
